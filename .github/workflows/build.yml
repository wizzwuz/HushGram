name: Build Patch (.mpp)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release with the .mpp bundle'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'Custom release tag (optional, e.g. v0.0.18)'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build .mpp Patch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Patch Bundle (.mpp)
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.PAT || secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew :patches:generatePatchesList
          ./gradlew :patches:buildAndroid --stacktrace

      - name: Verify and Generate Checksums
        run: |
          cd patches/build/release
          echo "=== Built release files ==="
          ls -la
          sha256sum patches-*.mpp > SHA256SUMS.txt
          if ls patches-*.cdx.json 1> /dev/null 2>&1; then
            sha256sum patches-*.cdx.json >> SHA256SUMS.txt
          fi
          echo "=== SHA256SUMS.txt ==="
          cat SHA256SUMS.txt

      - name: Upload .mpp Patch Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hushgram-patches
          path: |
            patches/build/release/*.mpp
            patches/build/release/*.cdx.json
            patches/build/release/*.sha256
            patches/build/release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Determine Release Info
        id: release_info
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        run: |
          VERSION=$(grep '^version\s*=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          if [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v${VERSION}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "title=HushGram ${TAG}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.release_info.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.title }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            patches/build/release/*.mpp
            patches/build/release/*.cdx.json
            patches/build/release/*.sha256
            patches/build/release/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
